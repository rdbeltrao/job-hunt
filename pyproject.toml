[project]
name = "jobs"
version = "0.1.0"
description = "Fetch job postings from several sources and print them as normalized records."
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "playwright>=1.64.0",
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
