# Copy this file to companies.yaml (ignored by git) and edit it.
# Companies whose career pages are read directly through their applicant-tracking
# system's public API. Supported `ats` values and where the slug comes from:
#   personio    https://{slug}.jobs.personio.de
#   greenhouse  https://job-boards.greenhouse.io/{slug}  (or boards.greenhouse.io/{slug})
#   ashby       https://jobs.ashbyhq.com/{slug}
#
# A board lists every opening, so only titles containing one of `title_keywords`
# (case-insensitive) are kept. Set `title_keywords: []` to keep everything.
title_keywords:
  - engineering manager
  - head of engineering
  - tribe lead
  - engineering lead
  - head of technology
  - head of software

# Example list: German or EU-remote tech companies whose slugs answered HTTP 200 on
# 2026-10-16. Replace with the companies you care about; add `enabled: false` to pause one.
companies:
